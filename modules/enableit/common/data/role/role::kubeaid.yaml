---
common::system::purge_root_ssh_keys: false
common::system::openvox::manage: false
common::monitor::enable: false
common::system::systemd::manage_journald: false
common::system::systemd::manage_resolved: false
common::backup::manage: false
common::user_management::security::manage: false
common::user_management::motd::enable: false
common::user_management::sshd::manage: false
common::system::kernel::modules: {}
# ZFS is usually installed by KubeAid StorageCTL; overrides facts/zfs_present=true.yaml,
# which would install it (dkms + repo) on any host that has it.
common::storage::zfs::enable: false
# manage: true removes unattended-upgrades and sets APT::Periodic::Update-Package-Lists and
# APT::Periodic::Unattended-Upgrade to "0" in /etc/apt/apt.conf.d/20auto-upgrades.
# enable: false overrides common.yaml's enable: true, so the obmondo-system-update timer
# isn't installed.
common::system::updates::manage: true
common::system::updates::enable: false
# KubeAid clusters run Cilium. If firewall management is ever switched on for
# these nodes, the chain purge has to skip Cilium's rules or pod networking and
# service NAT break on every Puppet run.
common::network::firewall::allow_k8s: true
